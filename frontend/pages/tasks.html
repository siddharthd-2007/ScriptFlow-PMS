<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks | ScriptFlow PMS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <aside id="sidebar"></aside>

        <div class="main-content">

            <!-- Topbar -->
            <header id="topbar"></header>

            <main>

                <!-- ================= Page Header ================= -->



                <!-- ================= Statistics ================= -->

                <div class="row g-4 mb-4">

                    <div class="col-xl-3 col-md-6">

                        <div class="card">

                            <div class="card-body">

                                <small class="text-muted">
                                    Total Tasks
                                </small>

                                <h2 id="totalTasks" class="fw-bold mt-2">

                                    0

                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="card">

                            <div class="card-body">

                                <small class="text-muted">
                                    Completed
                                </small>

                                <h2 id="completedTasks" class="fw-bold mt-2 text-success">

                                    0

                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="card">

                            <div class="card-body">

                                <small class="text-muted">
                                    In Progress
                                </small>

                                <h2 id="progressTasks" class="fw-bold mt-2 text-primary">

                                    0

                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="card">

                            <div class="card-body">

                                <small class="text-muted">
                                    Overdue
                                </small>

                                <h2 id="overdueTasks" class="fw-bold mt-2 text-danger">

                                    0

                                </h2>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- ================= Filters ================= -->

                <div class="card mb-4">

                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-lg-5">

                                <input id="taskSearch" class="form-control" placeholder="Search tasks...">

                            </div>

                            <div class="col-lg-3">

                                <select id="statusFilter" class="form-select">

                                    <option value="">
                                        All Status
                                    </option>

                                    <option>
                                        To Do
                                    </option>

                                    <option>
                                        In Progress
                                    </option>

                                    <option>
                                        Review
                                    </option>

                                    <option>
                                        Completed
                                    </option>

                                    <option>
                                        Blocked
                                    </option>

                                </select>

                            </div>

                            <div class="col-lg-2">

                                <select id="priorityFilter" class="form-select">

                                    <option value="">
                                        All Priority
                                    </option>

                                    <option>
                                        Low
                                    </option>

                                    <option>
                                        Medium
                                    </option>

                                    <option>
                                        High
                                    </option>

                                    <option>
                                        Critical
                                    </option>

                                </select>

                            </div>

                            <div class="col-lg-2">

                                <button id="resetFilters" class="btn btn-outline-secondary w-100">

                                    Reset

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- ================= Task Table ================= -->

                <div class="card">

                    <div class="table-responsive">

                        <table class="table align-middle mb-0">

                            <thead>

                                <tr>

                                    <th style="width:30%;">
                                        Task
                                    </th>

                                    <th>
                                        Module
                                    </th>

                                    <th>
                                        Assignee
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        Priority
                                    </th>

                                    <th>
                                        Due Date
                                    </th>

                                    <th width="170">
                                        Actions
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="tasksTableBody">

                            </tbody>

                        </table>

                    </div>

                </div>

            </main>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- Create Task Modal -->
    <!-- ===================================================== -->

    <div class="modal fade" id="taskModal" tabindex="-1">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="taskModalTitle">

                        Create New Task

                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="taskForm">

                        <div class="row g-3">

                            <div class="col-md-12">

                                <label class="form-label">
                                    Title *
                                </label>

                                <input id="taskTitle" class="form-control" required>

                            </div>

                            <div class="col-md-12">

                                <label class="form-label">
                                    Description
                                </label>

                                <textarea id="taskDescription" class="form-control"></textarea>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Module *
                                </label>

                                <select id="taskModule" class="form-select" required>

                                </select>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Assign To
                                </label>

                                <select id="taskAssignee" class="form-select">

                                    <option value="">
                                        Unassigned
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Priority
                                </label>

                                <select id="taskPriority" class="form-select">

                                    <option>Low</option>
                                    <option>Medium</option>
                                    <option selected>High</option>
                                    <option>Critical</option>

                                </select>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Status
                                </label>

                                <select id="taskStatus" class="form-select">

                                    <option selected>
                                        To Do
                                    </option>

                                    <option>
                                        In Progress
                                    </option>

                                    <option>
                                        Review
                                    </option>

                                    <option>
                                        Completed
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Start Date
                                </label>

                                <input type="date" id="taskStartDate" class="form-control">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Due Date
                                </label>

                                <input type="date" id="taskDueDate" class="form-control">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Estimated Hours
                                </label>

                                <input type="number" id="taskEstimatedHours" class="form-control" value="0">

                            </div>

                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button id="saveTaskBtn" class="btn btn-primary">

                        <i class="bi bi-check-lg me-2"></i>

                        Create Task

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/components/sidebar.js"></script>
    <script src="../assets/components/topbar.js"></script>
    <script src="../assets/js/tasks.js"></script>


</body>

</html>
