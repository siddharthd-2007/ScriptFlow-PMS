<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar | ScriptFlow PMS</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->

        <main class="main-content">

            <div id="topbar"></div>

            <section class="dashboard-container">


                <div class="card dashboard-card">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <h4 class="fw-semibold mb-0" id="monthYear">
                                July 2026
                            </h4>

                            <div class="d-flex gap-2">

                                <button id="prevMonth" class="btn btn-outline-secondary">

                                    <i class="bi bi-chevron-left"></i>

                                </button>

                                <button id="nextMonth" class="btn btn-outline-secondary">

                                    <i class="bi bi-chevron-right"></i>

                                </button>

                            </div>

                        </div>

                        <div id="calendarGrid" class="calendar-grid">

                            <div class="day-name">Sun</div>
                            <div class="day-name">Mon</div>
                            <div class="day-name">Tue</div>
                            <div class="day-name">Wed</div>
                            <div class="day-name">Thu</div>
                            <div class="day-name">Fri</div>
                            <div class="day-name">Sat</div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="../assets/js/api.js"></script>

    <script src="../assets/components/sidebar.js"></script>
    <script src="../assets/components/topbar.js"></script>

    <script>
        loadSidebar("calendar.html");

        loadTopbar({
            page: "Calendar",
            subtitle: "Manage project schedules and task deadlines",
            showSearch: false,
            showNewButton: false
        });
    </script>

    <script src="../assets/js/calendar.js"></script>

</body>

</html>
