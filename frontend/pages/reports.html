<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | ScriptFlow PMS</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/dashboard.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->

        <div id="sidebar"></div>
        <!-- Main Content -->

        <main class="main-content">

            <!-- Navbar -->

            <div id="topbar"></div>

            <!-- Dashboard Content -->

            <section class="dashboard-container">

                <div class="row g-4">

                    <div class="col-lg-3 col-md-6">

                        <div class="overview-card">

                            <div>

                                <small>Total Revenue</small>

                                <h2>₹12.5L</h2>

                            </div>

                            <div class="overview-icon bg-success-soft">

                                <i class="bi bi-currency-rupee"></i>

                            </div>

                        </div>

                    </div>

                    <div class="col-lg-3 col-md-6">

    <div class="overview-card">

        <div>

            <small>Projects</small>

            <h2 id="totalProjects">0</h2>

        </div>

        <div class="overview-icon bg-primary-soft">

            <i class="bi bi-kanban-fill"></i>

        </div>

    </div>

</div>

                    <div class="col-lg-3 col-md-6">

    <div class="overview-card">

        <div>

            <small>Employees</small>

            <h2 id="totalEmployees">0</h2>

        </div>

        <div class="overview-icon bg-warning-soft">

            <i class="bi bi-people-fill"></i>

        </div>

    </div>

</div>

                    <div class="col-lg-3 col-md-6">

    <div class="overview-card">

        <div>

            <small>Tasks Completed</small>

            <h2 id="totalTasks">0</h2>

        </div>

        <div class="overview-icon bg-success-soft">

            <i class="bi bi-check-circle-fill"></i>

        </div>

    </div>

</div>

                </div>

                <div class="row mt-4">

                    <div class="col-lg-8">

                        <div class="dashboard-card">

                            <div class="dashboard-card-header">

                                <h5>Task Status Overview</h5>

                            </div>

                            <div class="dashboard-card-body">

                             <div class="mb-4">

    <div class="d-flex justify-content-between mb-2">

        <span>Department Name</span>

        <strong>75%</strong>

    </div>

    <div class="progress">

        <div
            class="progress-bar bg-success"
            style="width:75%">
        </div>

    </div>

</div>

                                <p>UI / UX</p>

                                <div class="progress mb-3">
                                    <div class="progress-bar bg-success" style="width:75%">
                                        75%
                                    </div>
                                </div>

                                <p>Testing</p>

                                <div class="progress mb-3">
                                    <div class="progress-bar bg-warning" style="width:60%">
                                        60%
                                    </div>
                                </div>

                                <p>Deployment</p>

                                <div class="progress">
                                    <div class="progress-bar bg-danger" style="width:45%">
                                        45%
                                    </div>
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="col-lg-4">

                        <div class="dashboard-card">

                            <div class="dashboard-card-header">

                                <h5>Top Performers</h5>

                            </div>

                            <div class="dashboard-card-body" id="taskStatusContainer">

    <div class="text-center text-muted py-4">
        Loading task status...
    </div>

</div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>

    <script src="../assets/components/sidebar.js"></script>
    <script src="../assets/components/topbar.js"></script>

    <script>
        loadSidebar("reports.html");

        loadTopbar({
            page: "Reports",
            subtitle: "Business insights and project analytics",
            showSearch: true,
            searchPlaceholder: "Search reports...",
            showNewButton: false
        });
    </script>

<script src="../assets/js/reports.js"></script>

</body>

</html>
