<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employees | ScriptFlow PMS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->
        <div id="sidebar"></div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Navbar -->
            <div id="topbar"></div>

            <!-- Employees -->
            <section class="dashboard-container">

                <div class="row g-4 mb-4">

                    <div class="col-lg-3 col-md-6">

                        <div class="overview-card">

                            <div>

                                <small>Total Employees</small>

                                <h2 id="totalEmployees">0</h2>

                            </div>

                            <div class="overview-icon bg-primary-soft">

                                <i class="bi bi-people-fill"></i>

                            </div>

                        </div>

                    </div>

                    <div class="col-lg-3 col-md-6">

                        <div class="overview-card">

                            <div>

                                <small>Active</small>

                                <h2 id="activeEmployees">0</h2>

                            </div>

                            <div class="overview-icon bg-success-soft">

                                <i class="bi bi-person-check-fill"></i>

                            </div>

                        </div>

                    </div>

                    <div class="col-lg-3 col-md-6">

                        <div class="overview-card">

                            <div>

                                <small>Departments</small>

                                <h2 id="departmentCount">0</h2>

                            </div>

                            <div class="overview-icon bg-warning-soft">

                                <i class="bi bi-buildings-fill"></i>

                            </div>

                        </div>

                    </div>

                    <div class="col-lg-3 col-md-6">

                        <div class="overview-card">

                            <div>

                                <small>Managers</small>

                                <h2 id="managerCount">0</h2>

                            </div>

                            <div class="overview-icon bg-danger-soft">

                                <i class="bi bi-person-badge-fill"></i>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <h3>Employees</h3>

                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">

                                <i class="bi bi-person-plus-fill"></i>

                                Add Employee

                            </button>

                        </div>

                        <div class="row mb-4">

                            <div class="col-md-8">

                                <input type="text" id="searchEmployee" class="form-control"
                                    placeholder="Search Employee...">

                            </div>

                            <div class="col-md-4">

                                <select id="departmentFilter" class="form-select">

                                    <option>All Departments</option>
                                    <option>Development</option>
                                    <option>UI/UX</option>
                                    <option>Testing</option>
                                    <option>HR</option>

                                </select>

                            </div>

                        </div>

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead>

                                    <tr>

                                        <th>Photo</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Department</th>
                                        <th>Status</th>
                                        <th>Action</th>

                                    </tr>

                                </thead>

                                <tbody id="employeeTable">

                                    <!-- Employees will be loaded here dynamically -->

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Add Employee Modal -->

    <div class="modal fade" id="addEmployeeModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Add Employee
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <form id="employeeForm">

                    <div class="modal-body">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Full Name</label>

                                <input type="text" id="full_name" class="form-control" required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Email</label>

                                <input type="email" id="email" class="form-control" required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Password</label>

                                <input type="password" id="password" class="form-control" required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Role</label>

                                <select id="role" class="form-select">

                                    <option>Admin</option>
                                    <option>Project Manager</option>
                                    <option>Employee</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Department</label>

                                <input type="text" id="department" class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Employee Code</label>

                                <input type="text" id="employee_code" class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Phone</label>

                                <input type="text" id="phone" class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Designation</label>

                                <input type="text" id="designation" class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Joining Date</label>

                                <input type="date" id="joining_date" class="form-control">

                            </div>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                            Cancel

                        </button>

                        <button type="submit" class="btn btn-primary">

                            Save Employee

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>

    <script src="../assets/components/sidebar.js"></script>
    <script src="../assets/components/topbar.js"></script>

    <script>
        loadSidebar("employees.html");

        loadTopbar({
            page: "Employees",
            subtitle: "Manage all company employees",
            showSearch: true,
            searchPlaceholder: "Search employees...",
            showNewButton: true,
            newButtonText: "Add Employee",
            newButtonId: "addEmployeeBtn"
        });
    </script>

    <script src="../assets/js/employees.js"></script>
