<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | ScriptFlow PMS</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/settings.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->

        <div id="sidebar"></div>
        <!-- Main Content -->

        <main class="main-content">

            <!-- Navbar -->

            <div id="topbar"></div>

            <!-- Dashboard Content -->

            <section class="dashboard-container">

                <div class="row g-4">

                    <!-- ================= LEFT SIDEBAR ================= -->

                    <div class="col-lg-3">

                        <div class="dashboard-card">

                            <div class="dashboard-card-header">

                                <h5 class="mb-0">
                                    Settings
                                </h5>

                            </div>

                            <div class="dashboard-card-body p-2">

                                <div class="settings-menu">

                                    <button class="settings-tab active" data-section="generalSection">

                                        <i class="bi bi-sliders"></i>

                                        <span>General</span>

                                    </button>

                                    <button class="settings-tab" data-section="companySection">

                                        <i class="bi bi-building"></i>

                                        <span>Company</span>

                                    </button>

                                    <button class="settings-tab" data-section="accountSection">

                                        <i class="bi bi-person-circle"></i>

                                        <span>Account</span>

                                    </button>

                                    <button class="settings-tab" data-section="securitySection">

                                        <i class="bi bi-shield-lock"></i>

                                        <span>Security</span>

                                    </button>

                                    <button class="settings-tab" data-section="notificationSection">

                                        <i class="bi bi-bell"></i>

                                        <span>Notifications</span>

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- ================= RIGHT CONTENT ================= -->

                    <div class="col-lg-9">

                        <div class="dashboard-card">

                            <div class="dashboard-card-header d-flex justify-content-between align-items-center">

                                <div>

                                    <h5 id="settingsTitle" class="mb-0">
                                        General Settings
                                    </h5>

                                    <small class="text-muted">

                                        Configure application preferences

                                    </small>

                                </div>

                                <button class="btn btn-primary" id="saveSettings">

                                    <i class="bi bi-check-circle me-2"></i>

                                    Save Changes

                                </button>

                            </div>

                            <div class="dashboard-card-body">

                                <!-- ===================================== -->
                                <!-- GENERAL SETTINGS -->
                                <!-- ===================================== -->
                                <div id="generalSection" class="settings-section">

                                    <div class="row g-4">

                                        <div class="col-md-6">

                                            <label class="form-label">Language</label>

                                            <select class="form-select" id="language">

                                                <option selected>English</option>
                                                <option>Hindi</option>

                                            </select>

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">Time Zone</label>

                                            <select class="form-select" id="timezone">

                                                <option selected>Asia/Kolkata</option>

                                            </select>

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">Date Format</label>

                                            <select class="form-select" id="dateFormat">

                                                <option>DD/MM/YYYY</option>
                                                <option>MM/DD/YYYY</option>

                                            </select>

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">Theme</label>

                                            <select class="form-select" id="theme">

                                                <option>Light</option>
                                                <option>Dark</option>
                                                <option selected>System Default</option>

                                            </select>

                                        </div>

                                    </div>

                                    <hr class="my-4">

                                    <div class="form-check form-switch">

                                        <input class="form-check-input" type="checkbox" id="darkMode">

                                        <label class="form-check-label" for="darkMode">

                                            Enable Dark Mode

                                        </label>

                                    </div>

                                </div>



                                <!-- ===================================== -->
                                <!-- COMPANY -->
                                <!-- ===================================== -->

                                <div id="companySection" class="settings-section d-none">

                                    <div class="row g-4">

                                        <div class="col-md-6">

                                            <label class="form-label">
                                                Company Name
                                            </label>

                                            <input type="text" class="form-control" id="companyName">

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">
                                                Company Email
                                            </label>

                                            <input type="email" class="form-control" id="companyEmail">

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">
                                                Phone Number
                                            </label>

                                            <input type="text" class="form-control" id="companyPhone">

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">
                                                Website
                                            </label>

                                            <input type="text" class="form-control" id="companyWebsite">

                                        </div>

                                        <div class="col-12">

                                            <label class="form-label">
                                                Company Address
                                            </label>

                                            <textarea class="form-control" rows="3" id="companyAddress">
</textarea>

                                        </div>

                                    </div>

                                </div>

                                <!-- ===================================== -->
                                <!-- ACCOUNT -->
                                <!-- ===================================== -->

                                <div id="accountSection" class="settings-section d-none">

                                    <div class="row g-4">

                                        <div class="col-md-6">
                                            <label class="form-label">Full Name</label>
                                            <input class="form-control" value="Admin User">
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Email Address</label>
                                            <input class="form-control" value="admin@scriptflow.com">
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Phone Number</label>
                                            <input class="form-control" value="+91 9876543210">
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Role</label>
                                            <input class="form-control" value="Administrator" disabled>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Username</label>
                                            <input class="form-control" value="admin">
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Department</label>
                                            <input class="form-control" value="Management">
                                        </div>

                                    </div>

                                </div>

                                <!-- ===================================== -->
                                <!-- SECURITY -->
                                <!-- ===================================== -->

                                <div id="securitySection" class="settings-section d-none">

                                    <div class="row g-4">

                                        <div class="col-md-6">

                                            <label class="form-label">
                                                Current Password
                                            </label>

                                            <input type="password" class="form-control">

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">
                                                New Password
                                            </label>

                                            <input type="password" class="form-control">

                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">
                                                Confirm Password
                                            </label>

                                            <input type="password" class="form-control">

                                        </div>

                                    </div>

                                    <hr class="my-4">

                                    <div class="form-check form-switch">

                                        <input class="form-check-input" type="checkbox" checked>

                                        <label class="form-check-label">

                                            Enable Two-Factor Authentication

                                        </label>

                                    </div>

                                </div>

                                <!-- ===================================== -->
                                <!-- NOTIFICATIONS -->
                                <!-- ===================================== -->

                                <div id="notificationSection" class="settings-section d-none">

                                    <div class="form-check form-switch mb-4">

                                        <input class="form-check-input" type="checkbox" checked>

                                        <label class="form-check-label">

                                            Email Notifications

                                        </label>

                                    </div>

                                    <div class="form-check form-switch mb-4">

                                        <input class="form-check-input" type="checkbox" checked>

                                        <label class="form-check-label">

                                            Browser Notifications

                                        </label>

                                    </div>

                                    <div class="form-check form-switch mb-4">

                                        <input class="form-check-input" type="checkbox" checked>

                                        <label class="form-check-label">

                                            Task Reminders

                                        </label>

                                    </div>

                                    <div class="form-check form-switch">

                                        <input class="form-check-input" type="checkbox">

                                        <label class="form-check-label">

                                            Weekly Reports

                                        </label>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>

    <script src="../assets/components/sidebar.js"></script>

    <script src="../assets/components/topbar.js"></script>

    <script src="../assets/js/settings.js"></script>

</body>

</html>
