<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects | ScriptFlow PMS</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/dashboard.css">

</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->

        <div id="sidebar"></div>


        <!-- Main Content -->

        <main class="main-content">

            <!-- Navbar -->

            <div id="topbar"></div>

            <!-- Dashboard Content -->

            <section class="dashboard-container">




                <div class="row g-4 mb-4">

                    <div class="col-md-3">

                        <div class="overview-card">

                            <div>

                                <small>Active</small>

                                <h2 id="activeProjects">0</h2>

                            </div>

                            <div class="overview-icon bg-primary-soft">

                                <i class="bi bi-kanban-fill"></i>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="overview-card">

                            <div>

                                <small>Completed</small>

                                <h2 id="completedProjects">0</h2>

                            </div>

                            <div class="overview-icon bg-success-soft">

                                <i class="bi bi-check-circle-fill"></i>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="overview-card">

                            <div>

                                <small>Delayed</small>

                                <h2 id="delayedProjects">0</h2>

                            </div>

                            <div class="overview-icon bg-danger-soft">

                                <i class="bi bi-exclamation-triangle-fill"></i>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="overview-card">

                            <div>

                                <small>Planning</small>

                                <h2 id="planningProjects">0</h2>

                            </div>

                            <div class="overview-icon bg-warning-soft">

                                <i class="bi bi-clock-history"></i>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="card dashboard-card">

                    <div class="card-body">

                        <div class="row g-3 align-items-end mb-4">

                            <div class="col-lg-4">
                                <label class="form-label fw-semibold">Search</label>
                                <input id="projectSearch" type="text" class="form-control"
                                    placeholder="Search by project, client or manager">
                            </div>

                            <div class="col-lg-3">
                                <label class="form-label fw-semibold">Status</label>
                                <select id="statusFilter" class="form-select">
                                    <option value="">All Status</option>
                                    <option>Planning</option>
                                    <option>In Progress</option>
                                    <option>Completed</option>
                                </select>
                            </div>

                            <div class="col-lg-3">
                                <label class="form-label fw-semibold">Priority</label>
                                <select id="priorityFilter" class="form-select">
                                    <option value="">All Priority</option>
                                    <option>Low</option>
                                    <option>Medium</option>
                                    <option>High</option>
                                </select>
                            </div>

                            <div class="col-lg-2 d-grid">
                                <button id="clearFilters" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-clockwise me-2"></i>
                                    Reset
                                </button>
                            </div>

                        </div>

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead>

                                    <tr>

                                        <th>Project</th>

                                        <th>Client</th>

                                        <th>Manager</th>

                                        <th>Priority</th>

                                        <th>Status</th>

                                        <th>Progress</th>

                                        <th>Deadline</th>

                                        <th>Actions</th>

                                    </tr>

                                </thead>
                                <tbody id="projectTable">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </section>


            <!-- Add Project Modal -->

            <div class="modal fade" id="addProjectModal" tabindex="-1">

                <div class="modal-dialog modal-lg">

                    <div class="modal-content">

                        <div class="modal-header">

                            <h5 class="modal-title">
                                Add Project
                            </h5>

                            <button type="button" class="btn-close" data-bs-dismiss="modal">
                            </button>

                        </div>

                        <form id="projectForm">

                            <div class="modal-body">

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">Project Name</label>

                                        <input type="text" id="name" class="form-control" required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">Client</label>

                                        <select id="client_id" class="form-select" required>

                                            <option value="">Select Client</option>

                                        </select>

                                    </div>

                                    <div class="col-md-12 mb-3">

                                        <label class="form-label">Description</label>

                                        <textarea id="description" class="form-control">
                            </textarea>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">Project Manager</label>

                                        <select id="manager_id" class="form-select">

                                            <option value="">Select Project Manager</option>

                                        </select>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">Priority</label>

                                        <select id="priority" class="form-select">

                                            <option>Low</option>
                                            <option selected>Medium</option>
                                            <option>High</option>

                                        </select>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">Status</label>

                                        <select id="status" class="form-select">

                                            <option selected>Planning</option>
                                            <option>In Progress</option>
                                            <option>Completed</option>

                                        </select>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">Start Date</label>

                                        <input type="date" id="start_date" class="form-control">

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">End Date</label>

                                        <input type="date" id="end_date" class="form-control">

                                    </div>

                                </div>

                            </div>

                            <div class="modal-footer">

                                <button class="btn btn-secondary" data-bs-dismiss="modal">

                                    Cancel

                                <button
    id="saveProjectBtn"
    class="btn btn-primary"
    type="submit">

    Save Project

</button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/api.js"></script>

    <script src="../assets/components/loader.js"></script>
    <script src="../assets/components/sidebar.js"></script>
    <script src="../assets/components/topbar.js"></script>

    <script src="../assets/js/projects.js"></script>
</body>

</html>
