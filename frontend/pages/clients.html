<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clients | ScriptFlow PMS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <!-- Shared Layout -->
    <link rel="stylesheet" href="../assets/css/layout.css">
    
    <!-- Shared Components -->
    <link rel="stylesheet" href="../assets/css/components.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

</head>

<body>

    <div id="sidebar"></div>

    <div class="main-wrapper">

        <div id="topbar"></div>

        <main class="page-content">


            <section class="dashboard-container">

                <div class="container-fluid px-0">

                    <!-- Statistics Cards -->

                    <div class="row g-4 mb-4">

                        <div class="col-lg-3 col-md-6">

                            <div class="overview-card">

                                <div>

                                    <small>Total Clients</small>

                                    <h2 id="totalClients">0</h2>

                                    <div class="growth positive">

                                        <i class="bi bi-building"></i>

                                        Registered

                                    </div>

                                </div>

                                <div class="overview-icon bg-primary-soft">

                                    <i class="bi bi-buildings-fill"></i>

                                </div>

                            </div>

                        </div>

                        <div class="col-lg-3 col-md-6">

                            <div class="overview-card">

                                <div>

                                    <small>Active Clients</small>

                                    <h2 id="activeClients">0</h2>

                                    <div class="growth positive">

                                        <i class="bi bi-check-circle"></i>

                                        Active

                                    </div>

                                </div>

                                <div class="overview-icon bg-success-soft">

                                    <i class="bi bi-check-circle-fill"></i>

                                </div>

                            </div>

                        </div>

                        <div class="col-lg-3 col-md-6">

                            <div class="overview-card">

                                <div>

                                    <small>Prospects</small>

                                    <h2 id="prospectClients">0</h2>

                                    <div class="growth">

                                        <i class="bi bi-person-plus"></i>

                                        Potential

                                    </div>

                                </div>

                                <div class="overview-icon bg-warning-soft">

                                    <i class="bi bi-person-plus-fill"></i>

                                </div>

                            </div>

                        </div>

                        <div class="col-lg-3 col-md-6">

                            <div class="overview-card">

                                <div>

                                    <small>Industries</small>

                                    <h2 id="industryCount">0</h2>

                                    <div class="growth">

                                        <i class="bi bi-diagram-3"></i>

                                        Categories

                                    </div>

                                </div>

                                <div class="overview-icon bg-danger-soft">

                                    <i class="bi bi-diagram-3-fill"></i>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- Client Table -->

                    <div class="card shadow-sm">
                        <div class="card-body">

                            <div class="row g-4 align-items-end mb-4">

                                <div class="col-lg-8">

                                    <label class="form-label">
                                        Search
                                    </label>

                                    <input id="searchClient" type="text" class="form-control"
                                        placeholder="Search by company, email or industry...">

                                </div>

                                <div class="col-lg-4">

                                    <label class="form-label">
                                        Department
                                    </label>

                                    <select id="departmentFilter" class="form-select">

                                        <option>All Departments</option>
                                        <option>Software</option>
                                        <option>Healthcare</option>
                                        <option>Finance</option>
                                        <option>Education</option>
                                        <option>Manufacturing</option>

                                    </select>

                                </div>

                                <div class="table-responsive">

                                    <table class="table table-hover align-middle">

                                        <thead>

                                            <tr>

                                                <th>Company</th>

                                                <th>Contact Person</th>

                                                <th>Email</th>

                                                <th>Phone</th>

                                                <th>Industry</th>

                                                <th>Status</th>

                                                <th>Action</th>

                                            </tr>

                                        </thead>

                                        <tbody id="clientTable">

                                        </tbody>

                                    </table>

                                </div>
                            </div>

                        </div>

                    </div>

                </div>
    </div>


    </section>

    </main>

    </div>
    <!-- Add Client Modal -->

    <div class="modal fade" id="addClientModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Add Client
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <form id="clientForm">

                    <div class="modal-body">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Company Name</label>
                                <input type="text" id="company_name" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Company Email</label>
                                <input type="email" id="email" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" id="phone" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Website</label>
                                <input type="text" id="website" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Industry</label>
                                <input type="text" id="industry" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contact Person</label>
                                <input type="text" id="contact_person" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contact Email</label>
                                <input type="email" id="contact_email" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contact Phone</label>
                                <input type="text" id="contact_phone" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select id="status" class="form-select">
                                    <option>Prospect</option>
                                    <option>Active</option>
                                    <option>Inactive</option>
                                </select>
                            </div>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                            Cancel

                        </button>

                        <button type="submit" class="btn btn-primary">

                            Save Client
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


    <script src="../assets/js/api.js"></script>

    <!-- Shared Layout -->
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/components/sidebar.js"></script>
    <script src="../assets/components/topbar.js"></script>

    <!-- Page -->
    <script src="../assets/js/clients.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

</body>

</html>
